:root {
	--ui: 1; /* The window scale; the script in the head replaces it before the first paint. */
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #091620;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #091620;
	font-family: 'SoL Title', 'Open Sans', sans-serif;
	font-weight: 600;
}

#status-column {
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%) scale(var(--ui));
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
}

#status-header {
	display: flex;
	align-items: center;
	gap: 10px;
}

#status-header svg {
	width: 64px;
	height: 64px;
}

#status-title {
	color: #f0d69b;
	font-size: 27px;
}

#status-step {
	color: #ccd9d1;
	font-size: 16px;
	min-height: 22px;
}

#status-godot {
	position: absolute;
	right: calc(24px * var(--ui));
	bottom: calc(24px * var(--ui));
	width: calc(150px * var(--ui));
	opacity: 0.85;
}

#status-godot svg {
	width: 100%;
	height: auto;
	display: block;
}

#status-notice {
	display: none;
	max-width: 600px;
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	padding: 1rem;
	color: #e0e0e0;
	font-family: 'Noto Sans', Arial, sans-serif;
	text-align: center;
}

	// Same numbers as scripts/ui/loading_screen.gd: the download fills the first share of the bar.
	const DOWNLOAD_SHARE = 0.4;
	const WIDTH = 440, HEIGHT = 70;
	const COLORS = { wave: '#4fb5d6', track: '#214254', hull: '#8c6138', sail: '#f0e3c2' };
	const overlay = document.getElementById('status');
	const wave = document.getElementById('status-wave');

		document.documentElement.style.setProperty('--ui', Math.min(innerWidth / 1280, innerHeight / 800));
	}

		return HEIGHT * 0.62 + Math.sin(x * 0.045 - time * 3.0) * 5.0 + Math.sin(x * 0.11 + time * 1.7) * 2.0;
	}

			return;
		}
		const time = (now - started) / 1000;
		shown = Math.min(progress, shown + (now - last) / 1000 * 1.5);

		context.lineWidth = 6;
		context.lineCap = 'round';
		context.lineJoin = 'round';

			}

		context.rotate(tilt);

		context.beginPath();

		open = true;
		const back = document.createElement('div');
		back.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(5,14,20,0.82);'
			+ 'display:flex;align-items:center;justify-content:center;font-family:\'Noto Sans\',Arial,sans-serif;';
		const card = document.createElement('div');
		card.style.cssText = 'max-width:460px;margin:16px;padding:22px 24px;background:#102a33;'
			+ 'border:1px solid #a78c56;border-radius:10px;color:#e4ece6;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5);';
		const texts = blocks();
		for (let i = 0; i < texts.length; i++) {
			const h = document.createElement('div');
			h.textContent = texts[i].title;
			h.style.cssText = 'color:#f0d69b;font-size:20px;font-weight:600;margin-bottom:8px;' + (i > 0 ? 'margin-top:16px;' : '');
			const p = document.createElement('div');
			p.textContent = texts[i].body;
			p.style.cssText = 'font-size:14px;line-height:1.5;white-space:pre-line;';
			card.appendChild(h); card.appendChild(p);
		}
		const link = document.createElement('a');
		link.href = ORIGINAL_URL;
		link.target = '_blank';
		link.rel = 'noopener';
		link.textContent = ORIGINAL_URL;
		link.style.cssText = 'display:block;color:#7ec6e0;word-break:break-all;margin:16px 0 18px;';
		const btn = document.createElement('button');
		btn.style.cssText = 'padding:8px 20px;border:0;border-radius:6px;background:#2d5560;color:#cdd;'
			+ 'font-size:14px;cursor:not-allowed;opacity:0.6;';
		btn.disabled = true;
		card.appendChild(link); card.appendChild(btn);
		back.appendChild(card);
		document.body.appendChild(back);

		const closeLabel = texts.map((t) => t.close).join(' · ');
		const until = Date.now() + CLOSE_DELAY * 1000; // By the clock: the game's loading blocks timers, which must not stretch the delay.
		const tick = () => {
			const left = Math.ceil((until - Date.now()) / 1000);
			btn.textContent = left > 0 ? closeLabel + ' (' + left + ')' : closeLabel;
			if (left <= 0) {
				btn.disabled = false;
				btn.style.cursor = 'pointer';
				btn.style.opacity = '1';
				return;
			}
			setTimeout(tick, 250);
		};
		tick();
		btn.addEventListener('click', () => { if (!btn.disabled) { back.remove(); open = false; } });
	}

	show();
	setInterval(show, NAG_MINUTES * 60 * 1000);
}());
		</script>
	</body>
</html>
